meta:
  version: 0.4.0
  updated: 2026-07-28
  default_grain: daily          # hourly reserved — enable only after >=30-day feed confirms volume
  domains: [coverme, gwam_retirement]
  sme_confirmations:            # rulings from Kerrian (Business SME), email 2026-07-27
    target_set: >
      Confirmed complete and current (incl. the data_feed_columns tags). Priority = the 5
      transactional funnel events, PAIRED with the tagged eVars as breakdown dimensions —
      e.g. funnel events by Product Category (post_evar4). Follow-up: some events require
      additional feed columns per the Adobe calculated-metrics documentation (not yet mapped).
    funnel_basis: >
      Visit-level counting approved (unique visitors unreliable due to cookies/browser
      settings). Save Quote (232) is an OPTIONAL step. A returning visitor can start an
      application from a saved quote, so a visit may carry App Start/Confirm with no quote
      events — the funnel is non-monotonic across visits; step ratios are population-level
      proxies, never within-visit sequences.
    scope: >
      Only coverme.com and pourmeproteger.com are currently valid domains; everything else
      is legacy or dev. insttrip retired (last data 2024-03-11; history kept for baseline
      context). Legacy life-insurance hits and prod-adjacent hosts are out of scope.
    bot_exclusion: >
      Dropping exclude_hit > 0 confirmed correct. eVar148 Bot Detector (catches bots past
      Adobe's built-in filters) is being verified with the implementation team — until then
      eVar116/eVar148 are corroboration signals only, not the exclusion rule.
    pending_with_sme: >
      (1) Identity of events 510/511/512/513 (~43.5% of hits each) and 514 — not in the data
      map. (2) Language field of record (eVar8 vs eVar149 vs prop5) — eVar8 looks mis-tagged
      (~96% EN vs ~50/50 domain split); interim rule = derive language from domain.
  notes: >
    One canonical Adobe hit schema serves both domains (ADR-0006); entries default to
    domain: shared unless a metric is proven domain-specific. No metric columns exist
    in the hit schema — every metric here is a downstream aggregate of decoded
    post_event_list events or column/eVar population rates (02 §2).
  report_suite_caveat: >
    The eVar slot numbers and post_event_list IDs below are CoverMe report-suite
    mappings. The GWAM manulifeglobalprod suite exposes different IDs (EDA S6
    observed 10000-10099, 500-504, 20 — all unresolved); GWAM needs its own
    dictionary / event-lookup extraction before these definitions transfer.
  gwam_sme_inputs:              # four-channel scope table from the Business SME, 2026-07-28
    status: >
      DRAFT INPUT — NOT YET RULED. Recorded verbatim as the scope spec of record and mapped
      cell-by-cell in doc 19; every cell is still a claim to verify. Contrast with
      meta.sme_confirmations above, which records actual rulings. No standing decision has
      been reversed on the strength of this table.
    channels:                   # Instance / Report Suite / Segment exactly as supplied
      public_website:
        instance: Manulife
        report_suite_label: Manulife Global Prod       # resolves to rsid manulifeglobalprod
        segment: "Brand (evar105) = 'ca-retirement :  : GWAM'"
      web_member:
        instance: Manulife
        report_suite_label: GRS+                       # RESOLVED (probe C1/C4) -> rsid manugrs; SME to ratify the string (doc 20 Q2)
        segment: "Platform - v185 = 'MPS Member'"      # v185 = eVar185 — CONFIRMED field of record (probe C4);
                                                       # 100% of manugrs's populated eVar185, 54.14% of the suite.
                                                       # NOT suite-unique: also 18.16% of manufingbrsmobileapp.prod,
                                                       # so the predicate must be suite AND segment.
      mobile:
        instance: Manulife Financial                   # NOTE: different Adobe login company (doc 20 Q10)
        report_suite_label: GBRS Mobile App - Production   # = manufingbrsmobileapp.prod (probe C1: 68.9% of source table, 881 days)
        segment: Canada Retirement App Pages v2        # an Adobe segment NAME; definition still not supplied (doc 20 Q11).
                                                       # Probe C8 reconstruction: post_pagename LIKE 'MPS %'
                                                       # (vs 'GB ' = Group Benefits, 'MM ' = app shell, 'CIAM Sign In').
      manulifeid:
        instance: Manulife
        report_suite_label: manucustomer.prod          # ABSENT from our feed — probe C9: 0 rows, not in the 16-rsid census.
                                                       # Data-ACCESS request, not a modelling gap (doc 20 Q2).
        segment: null                                  # SME: "Not sure how to seperate Retirement from other ManulifeID signins"
    metric_matrix: >
      Page Views / Visits / Visitors = all four channels (qualified "ideally non-marketing",
      undefined). Errors = web_member, mobile, manulifeid (NOT public_website). Sign in %
      rate completion and Sign in Error = manulifeid only. Read as 1 = in scope, 0 = out of
      scope -> 17 (metric x channel) pairs; that reading is itself unconfirmed (doc 20 Q4).
    conflicts_raised: >
      (1) BLOCKING — the manulifeid and web_member channels require exactly the individual-login
      traffic that doc-16 D8 (business rule, 2026-07-20) excludes in every mode via
      SCOPE_LOGIN_HOST_EXCLUDE. Two business rules point opposite ways; D8 stands until the
      authority that issued it rules otherwise (doc 20 Q1). (2) Scoping by segment instead of
      URL is a re-baseline event (conf/settings.py:25-31) and cannot be done incrementally.
      (3) A URL-based scope cannot express the mobile channel at all — app hits carry no page
      URL, and every scope predicate in the repo is a SQL LIKE on a URL column.
    pending_with_sme: >
      BLOCKING: Q1 sign-in vs D8 (now narrowed to web_member — manulifeid is moot until access);
      Q2 ACCESS to manucustomer.prod (escalated from "which rsid" — probe C9 found 0 rows; the
      GRS+/mobile halves of Q2 downgraded to ratification); Q3 segment-scope sign-off (probe C3
      priced it: +1,436 / -60,594 rows, ~96% overlap on the public website). Plus Q4 the 1/0
      reading, Q5 "non-marketing" (C10: only bites on public_website — campaign is 57% there vs
      0.5%/0.02% on web_member/mobile), Q6 page-views-vs-hits, Q7 error field + grain (C5: the
      fields ARE populated — eVar181/182/184 at 52/70/61% on manugrs), Q8 sign-in ratio
      definition (C6: eVar122/135 are 0% on the Canada suites — pagename funnel is the only
      path), Q9 the ManulifeID retirement split (C9: unanswerable until access), Q10 the
      "Manulife Financial" instance, Q11 the App Pages v2 segment definition (C8 reconstruction
      offered), Q12 thresholds and owners. Full text: research/claude/20-gwam-sme-questions.md.
    pending_with_us: >
      NONE — eda/gwam_channel_discovery.py (sections C1-C10) RAN CLEAN 2026-07-29 (doc 19 G1
      closed): 11 sections, run_manifest.skipped == {}, complete: true, 90-day window
      2026-04-29..2026-07-28. Export: gwam_channel_discovery.html. It settled rsid existence and
      history, web-vs-app per suite, the eVar105 value and delimiter, segment-vs-URL scope
      sizing, eVar185-vs-eVar110, error/sign-in field population, per-suite event ids, app
      pagenames, ManulifeID discriminators, and marketing candidates. Three pre-probe claims
      were CORRECTED: the delimiter is ":" not " : "; mobile is 68.9% of the table not 56.9%;
      and segment scope is marginally NARROWER than URL scope on the public website, not wider
      (so it does not close a French gap — the case for it rests on the other three channels).
      Results folded into docs 19, 20, 16 and 15.

