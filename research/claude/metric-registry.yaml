                                    # ↺ 2026-07-30 (v0.7.0) NO LONGER BLOCKING THE BUILD. Both bases are built
                                    # behind settings.PAGE_VIEW_BASIS; `hit-count` above describes the shipped
                                    # branch ("all_hits"), under which page_views_total == hits_total exactly.
                                    # The Q6 answer selects a constant, it no longer gates construction. To adopt
