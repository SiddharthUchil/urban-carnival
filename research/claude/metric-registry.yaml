  # zero-denominator day. A per-visit ratio is now DECLARABLE.
  # ↺ 2026-07-30 (v0.7.0) — and now DECLARED AND BUILT. Both are computed on every run, under
  # both bases, from local series `pv_per_visit` and `pv_bucket_share_{0,1,2,3_5,6plus}`.
  # They are NOT scored: detect/registry.SCORED_SERIES excludes the page-view family while Q6
  # is open, so they are inspectable in gold without raising alerts. Q6 is therefore no longer
  # a BUILD blocker — it is a PROMOTION blocker, which is the correct kind.
  # Probe C12 profiled the distributions first so thresholds are set
  # from data rather than from a guess; the baselines are recorded on each entry below.
  # Baselines are 88 days, rsid manulifeglobalprod, window 2026-05-01..2026-07-30, and are
  # measured on the ADOBE PAGE-VIEW basis (try_cast(post_page_event as int) == 0). If Q6 comes
  # back "every hit" instead, every number below is superseded — see gwam_pw_page_views.
  - metric_id: gwam_pw_pv_per_visit
    name: Page Views per Visit — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "visit-qualified: visit contains >=1 hit whose evar194 matches one of the 16 SME link rules (8 rules x en/fr, doc 21)"   # ↺ 2026-08-04, was the evar105 parts-match (doc-16 D13). ⚠ This signal's baselines below were measured on the OLD scope and do not carry over — probe C17 must re-measure them on the qualified-visit population. ↺ 2026-08-05 C17 RE-MEASURED: on the qualified population the two Q6 bases give 4.31 (all_hits) vs 1.65 (adobe_pv) pv/visit, from daily medians of 6,886 hits / 2,643 adobe page views over 1,599 visits. The old-scope 2.885 / 1.343 figures are SUPERSEDED and must not be used to set thresholds. Recalibrate against these when the qualified-visit scope is actually built.
    source_sheet: sme_anomaly_signals
    source_ref: "SME 2026-07-29: Page view per visit (if page view < 1 could be anomaly)"
    decode_rule: ratio              # page_views / visits. A daily ratio can only fall below 1 if visits exist with
                                    # zero page views, so the SME's "< 1" test is really a zero-page-view-visit
                                    # detector — C12 reports that share directly (share_pv_eq_0).
                                    # ↺ 2026-07-30 C12 BASELINE: pv_per_visit = 1.3219 suite / 1.3429 segment;
                                    # daily min 1.2236, max 1.5571. ⚠ THE LITERAL "< 1" TEST NEVER FIRED — on ZERO
                                    # of 88 days did the daily ratio reach 1.0, and the floor sits 22% above it.
                                    # As specified the signal is inert at daily grain; it is diluted because the
                                    # zero-page-view visits are averaged against the 78.8% of visits with exactly 1.
                                    # The quantity that IS detectable is share_pv_eq_0 = 3.25% suite / 2.38% segment,
                                    # which is a level worth alerting on and moves independently of the mean.
                                    # Do not set a "< 1" threshold; see doc 20 Q6 for the question put to the SME.
                                    # ↺ 2026-07-30 (v0.7.0) BUILT. `pv_per_visit` (page_views_total / visits_total)
                                    # and `pv_bucket_share_0` — the zero-page-view share, which is the detectable
                                    # form of this signal — are emitted on every run under both bases.
                                    # ⚠ GRAIN NOTE: the bucket shares are computed DATE-FIRST (group by
                                    # (date, visit key)) so the denominator is exactly visits_total. C12 grouped by
                                    # visit key alone and assigned each visit to min(process_date), so visits
                                    # spanning midnight bucket differently. The small deviation from C12's numbers
                                    # below is BY DESIGN — do not "correct" it, that would desynchronise the shares
                                    # from the visits_total they divide by.
    grain: daily
    direction: context_dependent    # the SME flags the LOW side; the enum has no lower_is_bad, and a spike is
                                    # independently interesting, so context_dependent is the honest reading
    owner: TBD
    status: candidate               # BUILT but not scored — Q6 still selects the numerator, and a candidate
                                    # metric must not alert (detect/registry.SCORED_SERIES)
  - metric_id: gwam_pw_pv_per_visit_dup2
    name: Exactly-2-Page-View Visit Share — Public Website (duplication indicator)
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "visit-qualified: visit contains >=1 hit whose evar194 matches one of the 16 SME link rules (8 rules x en/fr, doc 21)"   # ↺ 2026-08-04, was the evar105 parts-match (doc-16 D13). ⚠ This signal's baselines below were measured on the OLD scope and do not carry over — probe C17 must re-measure them on the qualified-visit population. ↺ 2026-08-05 C17 RE-MEASURED: on the qualified population the two Q6 bases give 4.31 (all_hits) vs 1.65 (adobe_pv) pv/visit, from daily medians of 6,886 hits / 2,643 adobe page views over 1,599 visits. The old-scope 2.885 / 1.343 figures are SUPERSEDED and must not be used to set thresholds. Recalibrate against these when the qualified-visit scope is actually built.
    source_sheet: sme_anomaly_signals
    source_ref: "SME 2026-07-29: if all pages are consistently at 2, sometimes an indicator of duplication"
    decode_rule: point-mass-share   # share of visits with EXACTLY 2 page views. The SME's signal is CONSISTENCY at 2,
                                    # not the level — i.e. an unusually stable point mass, which no current scorer
                                    # expresses (see section header). Needs a new rule kind, not a new threshold.
                                    # ↺ 2026-07-30 (v0.7.0) — HALF DONE, and the half matters. The VALUE is built:
                                    # `pv_bucket_share_2` is emitted every run by the new visit_pv_bucket engine.
                                    # The DETECTOR is not: firing on abnormally LOW dispersion is still unexpressed
                                    # by robust-z / level-shift / ECOD / rules. Deferred deliberately — calibrating
                                    # it before Q6 means calibrating it twice, since the basis moves the cv.
                                    # ↺ 2026-07-30 C12 BASELINE: share_pv_eq_2 = 11.67% suite / 12.66% segment.
                                    # Because the signal is about STABILITY, the dispersion is the figure that
                                    # matters, not the level: daily range 0.0768–0.1350, sd 0.0140, cv 0.122 (suite);
                                    # cv 0.099 (segment). That is the normal wobble a "suspiciously steady" detector
                                    # would have to fire BELOW, so it is the baseline to calibrate against.
                                    # Full bucket mix (suite): 0pv 3.3% / 1pv 78.8% / 2pv 11.7% / 3-5pv 5.2% / 6+ 1.1%.
    grain: daily
    direction: higher_is_bad
    owner: TBD
    status: candidate               # BUILT but not scored — blocked on Q6 for the numerator AND on the
                                    # low-dispersion detector kind, which is still unbuilt (see decode_rule)

