meta:
  version: 0.5.0
  updated: 2026-07-29
  default_grain: daily          # hourly reserved — enable only after >=30-day feed confirms volume
  domains: [coverme, gwam_retirement]
  sme_confirmations:            # rulings from Kerrian (Business SME), email 2026-07-27; ↺ extended 2026-07-29
    target_set: >
      Confirmed complete and current (incl. the data_feed_columns tags). Priority = the 5
      transactional funnel events, PAIRED with the tagged eVars as breakdown dimensions —
      e.g. funnel events by Product Category (post_evar4). Follow-up: some events require
      additional feed columns per the Adobe calculated-metrics documentation (not yet mapped).
    funnel_basis: >
      Visit-level counting approved (unique visitors unreliable due to cookies/browser
      settings). Save Quote (232) is an OPTIONAL step. A returning visitor can start an
      application from a saved quote, so a visit may carry App Start/Confirm with no quote
      events — the funnel is non-monotonic across visits; step ratios are population-level
      proxies, never within-visit sequences.
    scope: >
      Only coverme.com and pourmeproteger.com are currently valid domains; everything else
      is legacy or dev. insttrip retired (last data 2024-03-11; history kept for baseline
      context). Legacy life-insurance hits and prod-adjacent hosts are out of scope.
    bot_exclusion: >
      Dropping exclude_hit > 0 confirmed correct. eVar148 Bot Detector (catches bots past
      Adobe's built-in filters) is being verified with the implementation team — until then
      eVar116/eVar148 are corroboration signals only, not the exclusion rule.
    language: >
      APPROVED 2026-07-29 (Kerrian): derive language from the domain — coverme.com = EN,
      pourmeproteger.com = FR. This ratifies the 2026-07-27 interim rule, so no silver rebuild
      is needed; it is what cm_silver_lib.lang_from_host_expr already implements. eVar8 is
      confirmed suspect (~96% EN against a ~50/50 domain split) and is NOT the field of record.
      FORWARD NOTE: she expects eVar149 to "always be language" (a French page's URL is
      sometimes English-translated, so the URL is the weaker signal in principle) — eVar149 is
      therefore the likely permanent field of record, pending her confirmation. Switching to it
      would mean reworking that one expression and rebuilding silver; the domain rule holds
      until then.
    pii_consent: >
      CLEARED VERBALLY 2026-07-29 (Kerrian): no PII comes from Adobe, so landing CoverMe hits
      in the medallion architecture is approved. Consent is captured via OneTrust in eVar65 and
      is COOKIE consent — it carries no PII and is not an analytics-suppression flag. That
      reframes the opt-out question in readiness doc 17 item 9: the 91.7% "opt-out" share is a
      cookie preference, not a signal that those hits must be dropped, so aggregate anomaly
      KPIs may include them. The pipeline lands no consent column at all today and needs none.
    data_gaps: >
      ROOT CAUSE 2026-07-29 (Kerrian): the ~30 missing calendar days are FEED gaps, not site
      outages — they trace to the data migration to Databricks, where a source file (most
      likely hit_data) was not updated. This confirms the working assumption in readiness doc
      17 item 8, so the "impute/interpolate + mask before training" branch is the correct
      policy. Exact per-date confirmation is still pending: our date list has been shared with
      her and she will come back on it.
    pending_with_sme: >
      (1) Identity of events 510/511/512/513 (~43.5% of hits each) and 514 — not in the data
      map. (2) eVar148 Bot Detector verification with the implementation team (see
      bot_exclusion). (3) Confirmation that eVar149 is the permanent language field of record
      (see language). (4) Per-date confirmation of the ~30 missing days (see data_gaps).
  notes: >
    One canonical Adobe hit schema serves both domains (ADR-0006); entries default to
    domain: shared unless a metric is proven domain-specific. No metric columns exist
    in the hit schema — every metric here is a downstream aggregate of decoded
    post_event_list events or column/eVar population rates (02 §2).
