#    decode_rule values here extend the CoverMe vocabulary: hit-count, visit-distinct,
#    visitor-distinct, error-count, completion-ratio, ratio, point-mass-share. The first
#    three map onto existing gold_lib sources (hits/visits/visitors).
#    ↺ 2026-07-30 (v0.7.0) — the two "not yet buildable" notes here are BOTH superseded:
#      - completion-ratio / ratio: DECLARABLE since G2 closed (SeriesSpec carries
#        numerator/denominator) and now actually DECLARED — see gwam_pw_pv_per_visit.
#      - point-mass-share: HAS AN ENGINE now. A `visit_pv_bucket` source with kind=point_mass
#        aggregates to visit grain and emits each bucket's share of visits, in both builders
#        (detect/kpis.py + databricks/src/gold_lib.py), parity-tested under both bases.
#        NOTE what this does and does not give you: the VALUE is built and scoreable by the
#        existing detectors, but the SME's actual dup2 signal is "unusually STEADY at 2",
#        which is a low-dispersion test that robust-z / level-shift / ECOD / rules still do
#        not express. That detector remains unbuilt — deliberately, since its calibration
#        depends on which basis Q6 selects (C12 baseline: cv 0.122 suite / 0.099 segment).
# ------------------------------------------------------------------
gwam_channel_metrics:   # 19 entries (3 traffic x 4 channels + 3 errors + 2 sign-in + 2 anomaly signals)

  # ---- Public Website — rsid manulifeglobalprod; scope = the 16 SME link rules ----
  # ↺ 2026-08-04 SCOPE REDEFINED (doc-16 D13, doc 21). The SME sent 8 named link-click rules,
  # each in English and French, as (evar193 Link Name, evar194 Link Href) pairs, and ratified
  # them as the SCOPE for these site-wide metrics — not as an extra breakdown. A visit is in
  # Public Website scope if it contains >= 1 rule-matching link click; Visits/Visitors count
  # those qualified visits, Page Views count page views WITHIN them.
  #
  # This is the doc-16 D10 event (scope moving off URL patterns = one clean re-baseline), and it
  # SUPERSEDES D10's standing "stay on URL scope" recommendation by SME ruling. It also
  # supersedes the eVar105 half of D11 — pending doc 20 Q19, because the new spec never mentions
  # eVar105 and nobody has said whether the brand tag still applies on top of the rules. Probe
  # C18 sizes the overlap so that is a priced question. The old predicate string and its
  # justification are kept in the history below: they are what a re-widening would restore.
  #
  # ⚠ NOT YET BUILDABLE, and the gate is volume not engineering. conf/bronze_columns.py projects
  # 17 columns and ZERO eVars, so the predicate is not evaluable anywhere in the lake; and gold
  # has no source that counts visits/visitors filtered to a dimension value. Both are tractable
  # (add post_evar101/193/194 to bronze+silver, compute a `visit_qualified` flag in
  # 02_silver_conform.py, filter in 03_gold_kpis.py — which leaves gold_lib.py and detect/kpis.py
  # untouched, so the 04_detect parity assertion holds for free). What is NOT tractable by
  # engineering is whether enough qualified visits exist per day to detect on. Probe C17 answers
  # that FIRST. Nothing here is built until it does.
  # ↺ 2026-08-05 -- C17 ANSWERED IT: median 1,599 qualified visits/day, 0 days below 100, over 88
  # days. The volume gate is CLEARED and the build is unblocked. What remains of this warning is
  # only the first half: bronze still projects zero eVars, so the predicate is still not evaluable
  # in the lake. Cost of the change, now known: share_of_url_scope_retained = 0.250 (all 42 series
  # rebuild on ~25% of today's population) -- accepted as the PHASE-1 scope, re-widening deferred.
  #
  # ⚠⚠ post_evar194 MUST NEVER ENTER A URL COALESCE (doc-16 D14). Five of the eight rules point
  # at id.manulife.ca / portal.manulife.ca, both on SCOPE_LOGIN_HOST_EXCLUDE. That list is
  # matched against the PAGE url, which is what lets these clicks survive — D8 excludes login
  # page views, not intent-to-log-in measured on a public marketing page (D8 amended to say so).
  # Fold the href into any url expression and the pipeline silently deletes exactly the rows the
  # SME asked us to alert on, while looking like it ran clean. Pinned by tests/test_link_rules.py.
  #
  # ↺ 2026-07-29: the ONLY channel in the alerting scope (SME ruling). 5 entries.
  # Probe C1: 9.1M rows but only 138 days of history (from 2026-03-10) — thinnest baseline margin
  # of the three located suites. C3: the SME's literal value exists (776,860 hits); a second form
  # "Manulife : GWAM : group-plans:ca-retirement" (526,357) means the predicate must match on the
  # PARTS (ca-retirement + GWAM), not equal the one quoted string. Delimiter is ":" not " : ".
  #
  # MARKETING EXCLUSION — the "ideally non-marketing" qualifier, ANSWERED 2026-07-29 (Abhisekh):
  # marketing traffic = hits carrying the CID campaign identifier, the standard query-string
  # parameter appended to marketing URLs. NOT YET IMPLEMENTABLE, two reasons: (a) our marketing
  # candidate is Adobe's post_campaign column (C10: 57.03% populated here), and nothing yet
  # proves it is equivalent to CID presence — probe C11 tests exactly that; (b) ↺ CORRECTED
  # 2026-08-04 — this used to read "the pipeline STRIPS query strings by policy (ADR-0007)",
  # which is false of the code. Bronze writes post_page_url VERBATIM and nothing in
  # bronze/silver/gold strips a query string; ADR-0007 governs identity pseudonymization, not
  # URL truncation. Only the EDA notebooks strip. The actual constraint is that SILVER_COLUMNS
  # drops post_page_url, so a cid= parse has to live at bronze or silver — a design decision,
  # not an ADR amendment. Doc 16's backlog item is retagged accordingly. Until then these
  # metrics count ALL public-website traffic, marketing included.
  #
  # BRAND PREDICATE — ✅ CONFIRMED 2026-07-30 (doc 20 Q3b, Abhisekh): neither `wealth-ca` nor
  # `pvt-wealth` is part of Canada Retirement, so the parts-match below is the definition of
  # record and widening to either variant is RULED OUT, not deferred. The predicate string is
  # unchanged — the hold was correct, so this costs no re-baseline. The history that produced
  # that ruling is kept below, because the sizing is what made the answer safe to act on.
  #
  # ↺ was: HELD at the parts-match below. The 2026-07-29 examples add
  # "Manulife: GWAM: wealth-ca" and "Manulife: GWAM : pvt-wealth"; both are presumably separate
  # lines of business, so widening the predicate is doc 20 Q3b, not an implementation detail.
  # ↺ 2026-07-30 probe C3 SIZED them (they are present in the data, not unseen as first assumed):
  # wealth-ca = 250,355 rows and pvt-wealth = 9,690 rows in the 90-day window, against
  # ca-retirement's 1,298,417. Decisive detail: overlap_with_ca_retirement is EXACTLY 0 for both,
  # so each is purely ADDITIVE (+19.3% / +0.7%) — including them cannot double-count, and
  # excluding them silently drops that traffic. Sizing is not an answer: STILL HELD pending Q3b.
  # ↺ 2026-07-30 — Q3b ANSWERED: both OUT. The sizing did its job (it turned "we don't recognise
  # these" into a priced either/or) and the SME chose exclusion, which is the branch that costs
  # nothing. The 250,355 wealth-ca rows are now unwatched BY DECISION — with zero overlap they
  # reach no other alert — and that is recorded here so a future reader does not mistake the
  # absence for a scope bug.
  - metric_id: gwam_pw_page_views
    name: Page Views — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "visit-qualified: visit contains >=1 hit whose evar194 matches one of the 16 SME link rules (8 rules x en/fr, doc 21)"
                                    # ↺ 2026-08-04 REPLACED the evar105 parts-match (doc-16 D13). Page Views are counted
                                    # WITHIN qualified visits, which is what keeps them coherent under either Q6 basis.
                                    # Whether the brand tag still ANDs on top is doc 20 Q19; probe C18 sizes the overlap.
                                    # ↺ was: "evar105 parts-match: contains 'ca-retirement' AND contains 'gwam'" — value
                                    # VERIFIED (probe C3), parts-match because a second brand form exists (see block note).
