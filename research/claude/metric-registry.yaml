#
# STATUS: MIXED. The CoverMe entries are SME-CONFIRMED (v0.3.0). The GWAM entries added in
# v0.4.0 are NOT -- they are a verbatim transcription of a scope table that has not yet been
# ruled on, and every one of them is `status: candidate` with `owner: TBD`. Nothing in
# `gwam_channel_metrics` may be promoted to `active` before (a) the discovery probe runs
# (eda/gwam_channel_discovery.py) and (b) the three blocking questions in doc 20 are answered
# -- above all Q1, which asks whether this table supersedes the 2026-07-20 login-exclusion
# rule (doc-16 D8). See meta.gwam_sme_inputs.
#
# v0.3.0 records the business rulings received 2026-07-27
# (Kerrian, SME): target set confirmed complete/current; the 5 transactional funnel
# events promoted to `active` (her stated priority) with owner assigned. See
# meta.sme_confirmations. v0.2.0 filled all 29 placeholders from the business-confirmed
# extraction of the dictionary workbook (row list provided 2026-07-08). Per-sheet
# counts match the v0.1.0 seed prediction exactly (9 / 8 / 12). Closes open task #3
