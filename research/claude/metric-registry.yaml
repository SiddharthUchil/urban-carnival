#    are `status: candidate`; the 14 web_member / mobile / manulifeid entries are
#    `status: deferred`. Deferred means kept-with-evidence, not deleted — each block
#    retains its probe findings so a re-widening is a status flip. EVERY entry is still
#    `owner: TBD` and none may be promoted to `active` before doc 20 Q3b (the wealth-ca /
#    pvt-wealth brand variants) and Q6 (the page-view numerator) are answered. Enforced by
#    tests/test_registry_yaml.py (test_gwam_channel_seed_counts, test_gwam_status_partition).
#
#    decode_rule values here extend the CoverMe vocabulary: hit-count, visit-distinct,
#    visitor-distinct, error-count, completion-ratio, ratio, point-mass-share. The first
#    three map onto existing gold_lib sources (hits/visits/visitors). completion-ratio and
#    ratio map onto the existing `ratio` kind (gold_lib.py:168-175) but cannot yet be
#    DECLARED, because GWAM's SeriesSpec has no numerator/denominator fields (doc 19 G2).
#    point-mass-share has no engine at all: it tests a single bucket of a distribution,
#    which none of the current scorers (robust-z, level-shift, ECOD, rules) expresses.
# ------------------------------------------------------------------
gwam_channel_metrics:   # 19 entries (3 traffic x 4 channels + 3 errors + 2 sign-in + 2 anomaly signals)

  # ---- Public Website — rsid manulifeglobalprod; scope = eVar105 brand tag ----
  # ↺ 2026-07-29: the ONLY channel in the alerting scope (SME ruling). 5 entries.
  # Probe C1: 9.1M rows but only 138 days of history (from 2026-03-10) — thinnest baseline margin
  # of the three located suites. C3: the SME's literal value exists (776,860 hits); a second form
  # "Manulife : GWAM : group-plans:ca-retirement" (526,357) means the predicate must match on the
  # PARTS (ca-retirement + GWAM), not equal the one quoted string. Delimiter is ":" not " : ".
  #
  # MARKETING EXCLUSION — the "ideally non-marketing" qualifier, ANSWERED 2026-07-29 (Abhisekh):
  # marketing traffic = hits carrying the CID campaign identifier, the standard query-string
  # parameter appended to marketing URLs. NOT YET IMPLEMENTABLE, two reasons: (a) our marketing
  # candidate is Adobe's post_campaign column (C10: 57.03% populated here), and nothing yet
  # proves it is equivalent to CID presence — probe C11 tests exactly that; (b) the pipeline
  # STRIPS query strings by policy (ADR-0007; bronze projects post_page_url only), so parsing
  # cid= in production needs an ADR amendment. Tracked in doc 16's backlog. Until then these
  # metrics count ALL public-website traffic, marketing included.
  #
  # BRAND PREDICATE — HELD at the parts-match below. The 2026-07-29 examples add
  # "Manulife: GWAM: wealth-ca" and "Manulife: GWAM : pvt-wealth"; both are unseen in our data
  # and presumably separate lines of business, so widening the predicate is doc 20 Q3b, not an
  # implementation detail. Probe C3 sizes them.
  - metric_id: gwam_pw_page_views
    name: Page Views — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "evar105 parts-match: contains 'ca-retirement' AND contains 'gwam'"   # value VERIFIED (probe C3);
                                    # parts-match because a second brand form exists (see block note); HELD here —
                                    # do NOT widen to wealth-ca / pvt-wealth before doc 20 Q3b.
                                    # Scope-model switch (segment vs URL) still needs sign-off (doc 20 Q3).
    source_sheet: sme_scope_table
    source_ref: Page Views (count)
    decode_rule: hit-count          # ⚠ we count hits; SME may mean Adobe page views (doc 20 Q6 — now ESCALATED,
                                    # since the two anomaly-signal seeds below divide by this numerator)
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate               # marketing rule ANSWERED 2026-07-29 (CID) but not yet implementable — see block note
  - metric_id: gwam_pw_visits
    name: Visits — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "evar105 parts-match: contains 'ca-retirement' AND contains 'gwam'"
    source_sheet: sme_scope_table
    source_ref: Visits (count)
    decode_rule: visit-distinct
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate
  - metric_id: gwam_pw_visitors
    name: Visitors — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "evar105 parts-match: contains 'ca-retirement' AND contains 'gwam'"
    source_sheet: sme_scope_table
    source_ref: Visitors (count)
    decode_rule: visitor-distinct   # ↺ 2026-07-29 the SME names "Unique ECID - unique visitor" an anomaly signal in its
                                    # own right, which this entry already covers: gold resolves visitor-distinct to
                                    # countDistinct(mcvisid) (databricks/src/gold_lib.py:94) and mcvisid IS the ECID.
                                    # ⚠ GRAIN DIVERGENCE to settle: the EDA notebooks count visitors as the
                                    # post_visid_high:post_visid_low pair instead (gwam_canada_retirement_eda.py:1320),
                                    # so EDA and gold can disagree on the same day. Probe C12 quantifies the gap daily.
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate

  # ---- Public Website anomaly signals — SME suggestions, 2026-07-29 (Abhisekh) ----
  # Two of his three suggestions land here as new seeds; the third (unique ECID visitors) is
  # already covered by gwam_pw_visitors above, see its decode_rule note.
  # BOTH are blocked on doc 19 G2 — detect/registry.py:68-83 SeriesSpec has no numerator/
  # denominator fields, so a per-visit ratio cannot be DECLARED even though gold_lib supports
  # the arithmetic — and on doc 20 Q6, which defines the page-view numerator. Probe C12
  # profiles the distributions first so thresholds are set from data, not from a guess.
  - metric_id: gwam_pw_pv_per_visit
    name: Page Views per Visit — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "evar105 parts-match: contains 'ca-retirement' AND contains 'gwam'"
    source_sheet: sme_anomaly_signals
    source_ref: "SME 2026-07-29: Page view per visit (if page view < 1 could be anomaly)"
    decode_rule: ratio              # page_views / visits. A daily ratio can only fall below 1 if visits exist with
                                    # zero page views, so the SME's "< 1" test is really a zero-page-view-visit
                                    # detector — C12 reports that share directly (share_pv_eq_0).
    grain: daily
    direction: context_dependent    # the SME flags the LOW side; the enum has no lower_is_bad, and a spike is
                                    # independently interesting, so context_dependent is the honest reading
    owner: TBD
    status: candidate               # blocked on G2 + Q6
  - metric_id: gwam_pw_pv_per_visit_dup2
    name: Exactly-2-Page-View Visit Share — Public Website (duplication indicator)
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "evar105 parts-match: contains 'ca-retirement' AND contains 'gwam'"
    source_sheet: sme_anomaly_signals
    source_ref: "SME 2026-07-29: if all pages are consistently at 2, sometimes an indicator of duplication"
    decode_rule: point-mass-share   # share of visits with EXACTLY 2 page views. The SME's signal is CONSISTENCY at 2,
                                    # not the level — i.e. an unusually stable point mass, which no current scorer
                                    # expresses (see section header). Needs a new rule kind, not a new threshold.
    grain: daily
    direction: higher_is_bad
    owner: TBD
    status: candidate               # blocked on G2 + Q6 + a new detector kind

