# ------------------------------------------------------------------
# 4) gwam_channel_metrics — 17 (metric x channel) pairs transcribed from the
#    SME four-channel scope table of 2026-07-28 (see meta.gwam_sme_inputs).
#
#    SEPARATE TOP-LEVEL SECTION, not a fourth "sheet": these do not come from a
#    dictionary workbook, they come from a scope table, and they carry two extra
#    fields (channel, report_suite_label) that the CoverMe sheets do not have.
#
#    EVERY entry is `status: candidate` / `owner: TBD` and must stay that way until
#    the probe runs AND doc 20 Q1-Q3 are answered. Promoting any of these to `active`
#    while doc-16 D8 still excludes login traffic would ship a metric whose scope
#    contradicts a standing business rule. Enforced by tests/test_registry_yaml.py
#    (test_gwam_channel_seed_counts).
#
#    decode_rule values here extend the CoverMe vocabulary: hit-count, visit-distinct,
#    visitor-distinct, error-count, completion-ratio. The first three map onto existing
#    gold_lib sources (hits/visits/visitors); completion-ratio maps onto the existing
#    `ratio` kind (gold_lib.py:168-175) but cannot yet be DECLARED, because GWAM's
#    SeriesSpec has no numerator/denominator fields (doc 19 G2).
# ------------------------------------------------------------------
gwam_channel_metrics:   # exactly 17 entries (3 traffic x 4 channels + 3 errors + 2 sign-in)

  # ---- Public Website — rsid manulifeglobalprod; scope = eVar105 brand tag ----
  # Probe C1: 9.1M rows but only 138 days of history (from 2026-03-10) — thinnest baseline margin
  # of the three located suites. C3: the SME's literal value exists (776,860 hits); a second form
  # "Manulife : GWAM : group-plans:ca-retirement" (526,357) means the predicate must match on the
  # PARTS (ca-retirement + GWAM), not equal the one quoted string. Delimiter is ":" not " : ".
  - metric_id: gwam_pw_page_views
    name: Page Views — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "evar105 = 'ca-retirement :  : GWAM'"   # value VERIFIED (probe C3); scope-model switch still needs sign-off (doc 20 Q3)
    source_sheet: sme_scope_table
    source_ref: Page Views (count)
    decode_rule: hit-count          # ⚠ we count hits; SME may mean Adobe page views (doc 20 Q6)
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate               # "ideally non-marketing" — undefined (doc 20 Q5)
  - metric_id: gwam_pw_visits
    name: Visits — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "evar105 = 'ca-retirement :  : GWAM'"
    source_sheet: sme_scope_table
    source_ref: Visits (count)
    decode_rule: visit-distinct
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate
  - metric_id: gwam_pw_visitors
    name: Visitors — Public Website
    domain: gwam_retirement
    channel: public_website
    report_suite_label: Manulife Global Prod
    scope_predicate: "evar105 = 'ca-retirement :  : GWAM'"
    source_sheet: sme_scope_table
    source_ref: Visitors (count)
    decode_rule: visitor-distinct
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate

  # ---- Web Member — rsid manugrs ("GRS+", data-confirmed; SME to ratify); scope = eVar185 platform tag ----
  # Probe C1/C4: 322M rows, 883 days. eVar185='MPS Member' = 54.14% of the suite and 100% of its
  # populated eVar185. NOTE eVar105 is populated on 0.0001% of rows here — effectively absent, so the
  # brand tag does NOT work on this suite; eVar185 is the only segment handle. Predicate must be
  # rsid AND segment ('MPS Member' also covers 18.16% of the mobile suite).
  - metric_id: gwam_wm_page_views
    name: Page Views — Web Member
    domain: gwam_retirement
    channel: web_member
    report_suite_label: GRS+        # = rsid manugrs (probe C1/C4, data-confirmed; SME to ratify — doc 20 Q2)
    scope_predicate: "evar185 = 'MPS Member'"   # eVar185 CONFIRMED as Platform (probe C4); eVar110 is a hashed id, not Platform
    source_sheet: sme_scope_table
    source_ref: Page Views (count)
    decode_rule: hit-count
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate               # ⚠ signed-in traffic — conflicts with doc-16 D8 (doc 20 Q1)
  - metric_id: gwam_wm_visits
    name: Visits — Web Member
    domain: gwam_retirement
    channel: web_member
    report_suite_label: GRS+
    scope_predicate: "evar185 = 'MPS Member'"
    source_sheet: sme_scope_table
    source_ref: Visits (count)
    decode_rule: visit-distinct
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate
  - metric_id: gwam_wm_visitors
    name: Visitors — Web Member
    domain: gwam_retirement
    channel: web_member
    report_suite_label: GRS+
    scope_predicate: "evar185 = 'MPS Member'"
    source_sheet: sme_scope_table
    source_ref: Visitors (count)
    decode_rule: visitor-distinct
    grain: daily
    direction: context_dependent
    owner: TBD
    status: candidate
  - metric_id: gwam_wm_errors
    name: Errors — Web Member
    domain: gwam_retirement
    channel: web_member
    report_suite_label: GRS+
    scope_predicate: "evar185 = 'MPS Member'"
    source_sheet: sme_scope_table
